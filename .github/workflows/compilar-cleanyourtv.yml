name: Compilar Aurora Chromatic (APK independente)
on:
  workflow_dispatch:
  push:
    branches: [main, aurora-purple-philco-v04, aurora-purple-philco-v05, aurora-purple-philco-v06, aurora-floating-sidebyside-v06, aurora-chromatic-v07]
    paths:
      - '.github/workflows/compilar-cleanyourtv.yml'
      - 'launcher/**'
      - 'themes/aurora-purple-philco/**'
      - 'themes/aurora-floating-philco/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK 34
        shell: bash
        run: |
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager não encontrado no runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Compilar APK
        run: |
          cd launcher
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain -PlauncherApplicationId=com.gathin.tvhome.aurora.chromatic assembleRelease
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Chromatic-v07-APK
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
