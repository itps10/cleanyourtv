name: Compilar Aurora PS4 HDMI 4 v2.1 (APK independente)
on:
  workflow_dispatch:
  push:
    branches: [main, aurora-purple-philco-v04, aurora-purple-philco-v05, aurora-purple-philco-v06, aurora-floating-sidebyside-v06, aurora-chromatic-v07, aurora-luxe-v08, aurora-neon-cards-v09, aurora-native-logos-v10, aurora-cinema-signature-v11, aurora-orbit-v12, aurora-orbit-fullbleed-v13, aurora-orbit-grid-v14, aurora-dark-icons-v15, aurora-dark-sharp-v16, aurora-dark-safe-zoom-v17, aurora-max-champions-v18, aurora-champions-feed-v19, aurora-champions-bluetooth-v20, aurora-ps4-hdmi4-v21]
    paths:
      - '.github/workflows/compilar-cleanyourtv.yml'
      - 'launcher/**'
      - 'themes/aurora-purple-philco/**'
      - 'themes/aurora-floating-philco/**'
      - 'scripts/aurora-cinema-signature-v11/**'
      - 'scripts/aurora-orbit-v12/**'
      - 'scripts/aurora-grid-v14/**'
      - 'scripts/aurora-dark-v15/**'
      - 'scripts/aurora-sharp-v16/**'
      - 'scripts/aurora-compact-v17/**'
      - 'scripts/aurora-champions-v18/**'
      - 'scripts/aurora-champions-v19/**'
      - 'scripts/aurora-champions-v20/**'
      - 'scripts/aurora-ps4-v21/**'

# When quick follow-up commits land, only the newest build publishes this Release.
concurrency:
  group: aurora-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar a fonte de placares da Champions (informativo)
        if: github.ref == 'refs/heads/aurora-ps4-hdmi4-v21'
        continue-on-error: true
        run: python3 scripts/aurora-champions-v19/verificar-espn.py
      - name: Instalar Android SDK 34
        shell: bash
        run: |
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager não encontrado no runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Compilar APK
        run: |
          cd launcher
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain -PlauncherApplicationId=com.gathin.tvhome.aurora.ps4 assembleRelease
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-PS4-HDMI4-v21-APK
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Preparar download direto (APK e papel de parede)
        if: github.ref == 'refs/heads/aurora-ps4-hdmi4-v21'
        shell: bash
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk aurora-ps4-v21.apk
          python3 -m pip install --quiet pillow
          python3 scripts/aurora-cinema-signature-v11/generate_wallpaper.py
          ls -lh aurora-ps4-v21.apk aurora_montanhas_lago_sem_interface.jpg
      - name: Publicar release para curl no Termux
        if: github.ref == 'refs/heads/aurora-ps4-hdmi4-v21'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aurora-ps4-hdmi4-v21-final
          target_commitish: ${{ github.sha }}
          name: Aurora PS4 HDMI 4 v2.1 — download direto
          body: |
            APK separado (com.gathin.tvhome.aurora.ps4) e wallpaper de montanhas e lago,
            sem widgets ou textos embutidos na imagem.
            Ambos podem ser baixados pelo Termux via HTTPS sem depender do ZIP do ChatGPT.
          files: |
            aurora-ps4-v21.apk
            aurora_montanhas_lago_sem_interface.jpg
          fail_on_unmatched_files: true
