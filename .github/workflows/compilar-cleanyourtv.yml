name: Compilar CleanYourTV oficial (APK)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK 34
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Compilar APK
        run: |
          cd launcher
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-APK
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
