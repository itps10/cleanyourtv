name: Compilar Aurora Cinema Signature v1.1
on:
  workflow_dispatch:
  push:
    branches: [main, aurora-purple-philco-v04, aurora-purple-philco-v05, aurora-purple-philco-v06, aurora-floating-sidebyside-v06, aurora-chromatic-v07, aurora-luxe-v08, aurora-neon-cards-v09, aurora-native-logos-v10, aurora-cinema-signature-v11]
    paths:
      - '.github/workflows/compilar-cleanyourtv.yml'
      - 'launcher/**'
      - 'themes/aurora-purple-philco/**'
      - 'themes/aurora-floating-philco/**'
      - 'scripts/aurora-cinema-signature-v11/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK 34
        shell: bash
        run: |
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager não encontrado no runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Compilar APK
        run: |
          cd launcher
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain -PlauncherApplicationId=com.gathin.tvhome.aurora.cinema assembleRelease
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Cinema-v11-APK
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Preparar download direto (APK e papel de parede)
        if: github.ref == 'refs/heads/aurora-cinema-signature-v11'
        shell: bash
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk aurora-cinema-v11.apk
          python3 -m pip install --quiet pillow
          python3 scripts/aurora-cinema-signature-v11/generate_wallpaper.py
          ls -lh aurora-cinema-v11.apk aurora_montanhas_lago_sem_interface.jpg
      - name: Publicar release para curl no Termux
        if: github.ref == 'refs/heads/aurora-cinema-signature-v11'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aurora-cinema-signature-v11
          target_commitish: ${{ github.sha }}
          name: Aurora Cinema Signature v1.1 — download direto
          body: |
            APK separado (com.gathin.tvhome.aurora.cinema) e wallpaper de montanhas e lago,
            sem widgets ou textos embutidos na imagem.
            Ambos podem ser baixados pelo Termux via HTTPS sem depender do ZIP do ChatGPT.
          files: |
            aurora-cinema-v11.apk
            aurora_montanhas_lago_sem_interface.jpg
          fail_on_unmatched_files: true
